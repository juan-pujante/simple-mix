name: Desktop validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux audio and display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio libasound2
          pulseaudio --start --exit-idle-time=-1
      - name: Tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Tests on Windows and macOS
        if: runner.os != 'Linux'
        run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simple-mix-${{ runner.os }}
          path: |
            artifacts/*.png
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
          if-no-files-found: ignore
