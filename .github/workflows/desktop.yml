name: Desktop validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux audio and display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio pulseaudio-utils libasound2
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          for attempt in {1..10}; do
            if pactl info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pactl load-module module-null-sink sink_name=simplemix-ci rate=44100
          pactl set-default-sink simplemix-ci
      - name: Tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run smoke tests
        if: runner.os != 'Linux'
        run: npm run test:smoke
      - name: Run native tests
        if: runner.os != 'Linux'
        run: npm run test:native
      - name: Run mastering tests
        if: runner.os != 'Linux'
        run: npm run test:mastering
      - name: Run boot tests
        if: runner.os != 'Linux'
        run: npm run test:boot
      - name: Run studio tests
        if: runner.os != 'Linux'
        run: npm run test:studio
      - name: Run audit tests
        if: runner.os != 'Linux'
        run: npm run test:audit
      - name: Run audio tests
        if: runner.os != 'Linux'
        run: npm run test:audio
      - name: Run gain tests
        if: runner.os != 'Linux'
        run: npm run test:gain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simple-mix-${{ runner.os }}
          path: |
            artifacts/*.png
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
          if-no-files-found: ignore
